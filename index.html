<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Passerelle 180 Atlas</title>
<meta name="description" content="180-second research talks from the Francophone world, with expert comments and partnerships with Korean companies and government. KO / EN / FR.">
<!--
  Passerelle 180 Atlas — 시연 페이지(단일 HTML + media/ 폴더). 인터넷 없이 더블클릭으로 열립니다.
  화면 언어: 한국어 / English / Français. 국가 경계: Natural Earth 1:110m(world-atlas).
  일부 연구자·대본·진행 기록·Q&A·전문가는 가상 예시입니다.
-->
<style>
:root{
  --paper:#FFFFFF; --mist:#F3F6F9; --mist-2:#E9EEF3;
  --ink:#15212E; --slate:#566373; --faint:#7D8896; --rule:#DDE3EA; --rule-2:#C6D0DA;
  --atlantic:#1F4F7A; --atlantic-2:#173D5F; --atlantic-t:#E6EEF6;
  --bridge:#D9592A;
  --infra:#22827A; --infra-t:#E5F2F0; --indus:#97690C; --indus-t:#F6EEDC; --innov:#3D64A0; --innov-t:#E7EDF7;
  --ok:#1F7A45; --ok-t:#E3F2E9;
  --font:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
html[lang="ko"] body{word-break:keep-all}
body{overflow-wrap:break-word;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--atlantic);text-underline-offset:3px}
:focus-visible{outline:2px solid var(--atlantic);outline-offset:2px;border-radius:4px}
.wrap{max-width:1200px;margin:0 auto;padding:0 32px}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h1,h2,h3,h4{margin:0;line-height:1.25;letter-spacing:-.01em}
p{margin:0}

/* ---------- Header ---------- */
.site-head{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.96);border-bottom:1px solid var(--rule);backdrop-filter:saturate(1.2) blur(6px)}
.head-row{display:flex;align-items:center;gap:28px;height:68px}
.brand{display:flex;align-items:center;gap:10px;border:0;background:none;padding:0;color:var(--ink);text-decoration:none}
.brand svg{flex:none}
.brand-name{font-size:18px;font-weight:700;letter-spacing:-.015em;white-space:nowrap}
.brand-name span{color:var(--bridge)}
.main-nav{display:flex;gap:4px;flex:1;min-width:0}
.main-nav button{border:0;background:none;padding:8px 12px;border-radius:6px;font-size:15px;color:var(--slate);white-space:nowrap}
.main-nav button:hover{color:var(--ink);background:var(--mist)}
.main-nav button[aria-current="page"]{color:var(--ink);font-weight:650;box-shadow:inset 0 -2px 0 var(--bridge);border-radius:0}
.head-tools{display:flex;align-items:center;gap:14px}
.langs{display:inline-flex;border:1px solid var(--rule-2);border-radius:6px;overflow:hidden}
.langs button{border:0;background:none;padding:5px 10px;font-size:13px;font-weight:600;color:var(--slate);letter-spacing:.02em}
.langs button+button{border-left:1px solid var(--rule-2)}
.langs button[aria-pressed="true"]{background:var(--ink);color:#fff}
.lite-toggle{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--slate);cursor:pointer;white-space:nowrap}
.lite-toggle input{appearance:none;width:32px;height:18px;border-radius:999px;background:var(--rule-2);position:relative;margin:0;cursor:pointer;transition:background .15s}
.lite-toggle input::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .15s}
.lite-toggle input:checked{background:var(--atlantic)}
.lite-toggle input:checked::after{transform:translateX(14px)}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--rule-2);background:var(--paper);color:var(--ink);border-radius:6px;padding:9px 16px;font-size:15px;font-weight:600;line-height:1.2;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn-primary{background:var(--atlantic);border-color:var(--atlantic);color:#fff}
.btn-primary:hover{background:var(--atlantic-2);border-color:var(--atlantic-2)}
.btn-sm{padding:6px 12px;font-size:14px}
.linkbtn{text-align:left;border:0;background:none;padding:0;color:var(--atlantic);font-weight:600;text-decoration:underline;text-decoration-color:transparent;text-underline-offset:4px}
.linkbtn:hover{text-decoration-color:currentColor}

/* ---------- Hero ---------- */
.hero{padding:72px 0 8px}
.hero h1{font-size:clamp(32px,4.1vw,50px);font-weight:700;letter-spacing:-.025em;line-height:1.16;max-width:20ch}
html[lang="fr"] .hero h1,html[lang="en"] .hero h1{max-width:24ch}
.hero .lead{margin-top:20px;font-size:18px;line-height:1.65;color:var(--slate);max-width:62ch}
.hero-cta{display:flex;gap:12px;margin-top:28px;flex-wrap:wrap}

/* The passerelle: one footbridge spanning the three steps */
.flow{position:relative;margin:64px 0 0}
.flow-steps{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(3,1fr);gap:0 40px}
.flow-arch path{vector-effect:non-scaling-stroke}
.flow-arch{position:absolute;left:0;right:0;top:0;height:92px;width:100%;pointer-events:none}
.flow-arch .arch{fill:none;stroke:var(--bridge);stroke-width:2.25}
.flow-arch .deck{stroke:var(--ink);stroke-width:1.5}
.flow-arch .hanger{stroke:var(--rule-2);stroke-width:1}
.flow-step{position:relative;padding-top:80px}
.flow-step .pier{position:absolute;top:81px;left:0;width:18px;height:18px;border-radius:50%;background:var(--paper);border:2px solid var(--ink);display:grid;place-items:center;font-size:10px;font-weight:700;line-height:1}
.flow-step:first-child .pier,.flow-step:last-child .pier{border-color:var(--bridge)}
.flow-step h3{margin-top:30px;font-size:20px;font-weight:700;display:flex;gap:10px;align-items:baseline}
.flow-step h3 .n{font-size:15px;color:var(--bridge);font-variant-numeric:tabular-nums}
.flow-step p{margin-top:8px;color:var(--slate);max-width:34ch}
.flow-step .linkbtn{margin-top:12px;font-size:15px}
.stats{margin-top:56px;padding:22px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);font-size:17px;color:var(--slate);max-width:none}
.stats strong{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}

/* ---------- Sections ---------- */
.panel{display:none}
.panel.on{display:block}
.section{padding:56px 0 72px;scroll-margin-top:60px}
#cbox{scroll-margin-top:20px}
.section-head{margin-bottom:24px;max-width:70ch}
.section-head h2{font-size:28px;font-weight:700;letter-spacing:-.02em}
.section-head p{margin-top:8px;color:var(--slate)}
.toolbar{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:center;margin-bottom:28px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--rule-2);background:var(--paper);border-radius:999px;padding:5px 13px;font-size:14px;color:var(--slate);display:inline-flex;align-items:center;gap:7px}
.chip:hover{border-color:var(--ink);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.tdot{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none}
.tdot.infra{background:var(--infra)}.tdot.indus{background:var(--indus)}.tdot.innov{background:var(--innov)}
.field{border:1px solid var(--rule-2);border-radius:6px;padding:8px 12px;background:var(--paper);min-width:240px;font-size:15px}
.field:focus{outline:2px solid var(--atlantic);outline-offset:0;border-color:var(--atlantic)}
.spacer{flex:1}
.empty{color:var(--slate);padding:32px;border:1px dashed var(--rule-2);border-radius:8px;text-align:center}

/* ---------- Video cards ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:40px 28px}
.vcard{display:flex;flex-direction:column;min-width:0}
.vcard.new .thumb{outline:2px solid var(--bridge);outline-offset:3px}
.thumb{position:relative;display:block;width:100%;aspect-ratio:16/9;border:0;padding:0;border-radius:6px;overflow:hidden;text-align:left;background:var(--mist)}
.thumb .tp{position:absolute;inset:0;padding:18px 20px;display:flex;flex-direction:column;justify-content:flex-end}
.thumb .tp.infra{background:var(--infra-t);color:var(--infra)}.thumb .tp.indus{background:var(--indus-t);color:var(--indus)}.thumb .tp.innov{background:var(--innov-t);color:var(--innov)}
.thumb .tp b{font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.thumb .tp small{font-size:13px;color:var(--slate);margin-top:2px}
.thumb .tp svg{position:absolute;left:20px;right:20px;top:22px;width:calc(100% - 40px);height:40%;overflow:visible}
.thumb .tp svg path{fill:none;stroke:currentColor;stroke-width:1.25;opacity:.28;vector-effect:non-scaling-stroke}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thumb .ttag{position:absolute;top:10px;left:10px;background:var(--paper);color:var(--ink);font-size:12px;font-weight:600;padding:2px 8px;border-radius:4px}
.thumb .ttag.real{background:var(--ink);color:#fff}
.thumb .tdur{position:absolute;right:10px;bottom:10px;background:rgba(21,33,46,.82);color:#fff;font-size:12px;padding:1px 7px;border-radius:4px;font-variant-numeric:tabular-nums}
.thumb:hover{filter:brightness(.97)}
.vcard .place{margin-top:14px;font-size:13.5px;color:var(--slate);display:flex;align-items:center;gap:8px}
.vcard h3{margin-top:4px;font-size:19px;font-weight:700;letter-spacing:-.015em}
.vcard h3 button{border:0;background:none;padding:0;text-align:left;color:inherit;font:inherit;letter-spacing:inherit}
.vcard h3 button:hover{color:var(--atlantic)}
.vcard .sum{margin-top:6px;color:var(--slate);font-size:15px}
.vcard .meta{margin-top:12px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:13.5px;color:var(--slate)}
.codes{display:inline-flex;gap:3px}
.codes i{font-style:normal;font-size:11px;font-weight:600;border:1px solid var(--rule-2);border-radius:3px;padding:0 4px;color:var(--slate)}
.codes i.o{border-color:var(--ink);color:var(--ink)}
.pill{display:inline-flex;align-items:center;font-size:12.5px;font-weight:650;padding:2px 10px;border-radius:999px;white-space:nowrap;border:1px solid var(--rule-2);color:var(--slate);background:var(--paper)}
.pill.progress{border-color:transparent;background:var(--atlantic-t);color:var(--atlantic)}
.pill.crossed{border-color:transparent;background:var(--ok-t);color:var(--ok)}
.pill.answered{border-color:transparent;background:var(--ok-t);color:var(--ok)}
.pill.pending{border-color:transparent;background:#FBEDE6;color:#A2401B}

/* ---------- Map ---------- */
.map-layout{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(300px,1fr);gap:28px;align-items:start}
.map-card{border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.map-bar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--rule)}
.seg{display:inline-flex;border:1px solid var(--rule-2);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--paper);padding:5px 12px;font-size:14px;color:var(--slate)}
.seg button+button{border-left:1px solid var(--rule-2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.seg button:disabled{opacity:.4;cursor:not-allowed}
.mapwrap{position:relative;background:#EEF3F8}
#map{display:block;width:100%;height:auto;aspect-ratio:1000/520}
#map .sphere{fill:#EEF3F8}
#map .grat{fill:none;stroke:#DCE4EC;stroke-width:.5;vector-effect:non-scaling-stroke}
#map .country{fill:#D8E0E8;stroke:#fff;stroke-width:.6;vector-effect:non-scaling-stroke}
#map .country.hl{fill:#CBDDDA}
#map .country.sel{fill:#9BC6BE}
#map .arc{fill:none;stroke-width:1.2;vector-effect:non-scaling-stroke;opacity:.7}
#map .arc.waiting{stroke-dasharray:2 5}
#map .arc.progress{stroke-dasharray:7 5}
#map .arc.infra{stroke:var(--infra)}#map .arc.indus{stroke:var(--indus)}#map .arc.innov{stroke:var(--innov)}
#map .arc.on{stroke-width:2.6;opacity:1}
#map .arc.draw{stroke-dasharray:1200;stroke-dashoffset:1200;animation:draw 1.4s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
#map .pin{cursor:pointer}
#map .pin .core{fill:#fff;stroke-width:2;vector-effect:non-scaling-stroke}
#map .pin.infra .core{stroke:var(--infra)}#map .pin.indus .core{stroke:var(--indus)}#map .pin.innov .core{stroke:var(--innov)}
#map .pin.filled.infra .core{fill:var(--infra)}#map .pin.filled.indus .core{fill:var(--indus)}#map .pin.filled.innov .core{fill:var(--innov)}
#map .pin.hub .core{fill:var(--bridge);stroke:#fff}
#map .pin .ring{fill:none;stroke:var(--ink);stroke-width:1.5;vector-effect:non-scaling-stroke;opacity:0}
#map .pin.sel .ring{opacity:1}
#map .pin.pulse .ring{opacity:1}
#map .plabel{font-family:var(--font);font-weight:650;fill:var(--ink);paint-order:stroke;stroke:#fff;stroke-linejoin:round;pointer-events:none;opacity:0}
#map .plabel.show{opacity:1}
.legend{position:absolute;left:12px;bottom:12px;background:rgba(255,255,255,.94);border:1px solid var(--rule);border-radius:6px;padding:8px 12px;font-size:12.5px;color:var(--slate);display:grid;gap:4px}
.legend .row{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center}
.legend svg{vertical-align:-2px;margin-right:4px}
.map-side{display:grid;gap:22px}
.map-detail{border-top:2px solid var(--ink);padding-top:16px}
.map-detail h3{font-size:21px;font-weight:700;margin-top:6px}
.map-detail .sum{margin-top:6px;color:var(--slate)}
.map-detail .figs{margin-top:14px}
.map-detail .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.plist-h{font-size:15px;font-weight:700}
.plist{display:grid;max-height:360px;overflow:auto;border-top:1px solid var(--rule)}
.plist button{display:flex;justify-content:space-between;align-items:center;gap:10px;border:0;border-bottom:1px solid var(--rule);background:none;padding:10px 4px;text-align:left;font-size:14.5px}
.plist button:hover{background:var(--mist)}
.plist button[aria-current="true"]{background:var(--mist);font-weight:650}
.plist .pl{display:flex;align-items:center;gap:9px;min-width:0}
.plist .pl span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hubul{margin:12px 0 0;padding-left:18px;display:grid;gap:6px;color:var(--slate)}

/* Key figures (shared) */
.figs{display:flex;flex-wrap:wrap;gap:14px 32px}
.fig{min-width:120px;max-width:240px}
.fig b{display:block;font-size:22px;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums;line-height:1.25}
.fig span{display:block;font-size:13.5px;color:var(--slate);line-height:1.45;margin-top:2px}

/* ---------- Q&A ---------- */
.qlist{display:grid;border-top:1px solid var(--rule)}
.qitem{padding:24px 0;border-bottom:1px solid var(--rule);display:grid;grid-template-columns:minmax(0,1fr) 200px;gap:8px 32px}
.qitem.new{background:linear-gradient(90deg,#FFF5EF,transparent 60%)}
.qmeta{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:13.5px;color:var(--slate)}
.qtext{margin-top:8px;font-size:18px;font-weight:600;letter-spacing:-.01em;max-width:70ch}
.qside{display:flex;flex-direction:column;gap:8px;align-items:flex-start;font-size:13px;color:var(--faint)}
.orig{margin-top:6px;font-size:14px;color:var(--slate)}
.orig summary{cursor:pointer;color:var(--atlantic);font-weight:600;width:max-content}
.orig p{margin-top:6px;font-style:italic}
.qnote{margin-top:14px;font-size:14.5px;color:var(--slate);padding-left:14px;border-left:2px solid var(--rule-2);max-width:72ch}
.qnote b{color:var(--ink);font-weight:650;margin-right:6px}
.qans{margin-top:16px;padding:16px 18px;background:var(--mist);border-radius:8px;max-width:76ch}
.qans .who{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:14px}
.qans p{margin-top:8px;font-size:15px}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:650;color:var(--ok)}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.badge.muted{color:var(--faint)}

/* ---------- Glossary ---------- */
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:0 32px;border-top:1px solid var(--rule)}
.gitem{padding:18px 0;border-bottom:1px solid var(--rule)}
.gitem.hit .gfr{color:var(--bridge)}
.gfr{font-size:18px;font-weight:700;letter-spacing:-.01em}
.gtr{margin-top:4px;display:grid;grid-template-columns:28px 1fr;gap:2px 8px;font-size:14.5px}
.gtr i{font-style:normal;font-size:11px;font-weight:650;color:var(--faint);padding-top:3px}
.gex{margin-top:10px;font-size:14px;color:var(--slate)}
.gex q{display:block;font-style:italic;color:var(--ink);quotes:none}
.gwarn{margin-top:8px;font-size:13.5px;color:#9A3C17}
.gdom{font-size:12.5px;color:var(--faint);margin-top:8px}
mark{background:#FFE3D3;color:inherit;border-radius:2px;padding:0 1px}

/* ---------- Viewer ---------- */
dialog{border:0;padding:0;background:transparent;color:var(--ink);max-width:none;max-height:none}
dialog::backdrop{background:rgba(21,33,46,.42)}
.viewer{width:min(1180px,100vw);height:100vh;margin:0 0 0 auto}
.vbox{height:100%;background:var(--paper);display:flex;flex-direction:column;box-shadow:-12px 0 40px rgba(21,33,46,.18)}
.vhead{padding:24px 36px 0}
.vhead .top{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}
.vhead .place{font-size:14px;color:var(--slate);display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
.vhead h2{margin-top:6px;font-size:28px;font-weight:700;letter-spacing:-.02em}
.vhead .who{margin-top:6px;color:var(--slate);font-size:15px}
.vhead .acts{display:flex;gap:8px;align-items:center;flex:none}
.xbtn{width:38px;height:38px;border:1px solid var(--rule-2);background:var(--paper);border-radius:6px;display:grid;place-items:center}
.xbtn:hover{border-color:var(--ink)}
.vtabs{display:flex;gap:4px;margin-top:18px;border-bottom:1px solid var(--rule);overflow-x:auto}
.vtabs button{border:0;background:none;padding:10px 14px;font-size:15px;color:var(--slate);white-space:nowrap;box-shadow:inset 0 -2px 0 transparent}
.vtabs button:hover{color:var(--ink)}
.vtabs button[aria-selected="true"]{color:var(--ink);font-weight:650;box-shadow:inset 0 -2px 0 var(--bridge)}
.vscroll{flex:1;overflow:auto;padding:28px 36px 48px}
.vsec{display:none}
.vsec.on{display:block}

/* Player */
.pgrid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(280px,1fr);gap:24px;align-items:start}
.player{border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.screen{position:relative;aspect-ratio:16/9;background:#0F1923;cursor:pointer;overflow:hidden}
.screen video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;display:block}
.screen .simart{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:0 9%;color:#fff}
.screen .simart.infra{background:linear-gradient(135deg,#1B4D49,#0F1923 70%)}.screen .simart.indus{background:linear-gradient(135deg,#4B3A12,#0F1923 70%)}.screen .simart.innov{background:linear-gradient(135deg,#21365A,#0F1923 70%)}
.screen .simart b{font-size:clamp(20px,2.6vw,30px);font-weight:700;letter-spacing:-.02em;max-width:22ch;line-height:1.2}
.screen .simart small{margin-top:8px;font-size:14px;opacity:.75}
.screen .wave{position:absolute;left:9%;right:9%;top:66%;height:26px;display:flex;gap:3px;align-items:flex-end;opacity:.35}
.screen .wave i{flex:1;background:#fff;height:12%;border-radius:1px}
.screen.playing .wave i{animation:wave 1s ease-in-out infinite alternate}
@keyframes wave{from{height:10%}to{height:100%}}
.screen .lbl{position:absolute;top:12px;left:12px;font-size:12px;color:#fff;background:rgba(0,0,0,.55);padding:2px 8px;border-radius:4px}
.screen .vo{position:absolute;top:12px;right:12px;font-size:12px;color:#fff;background:rgba(0,0,0,.55);padding:2px 8px;border-radius:4px}
.screen .vo:empty{display:none}
.screen .bigplay{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;transition:opacity .2s}
.screen.playing .bigplay{opacity:0}
.cbubble{position:absolute;top:44px;right:12px;max-width:60%;font-size:13px;color:var(--ink);background:#fff;padding:6px 12px;border-radius:6px;border-left:3px solid var(--bridge);opacity:0;transform:translateY(-4px);transition:opacity .25s,transform .25s;pointer-events:none}
.cbubble.on{opacity:1;transform:none;pointer-events:auto}
.cbubble u{cursor:pointer;margin-left:6px;color:var(--atlantic);text-decoration:underline}
.subs{position:absolute;left:0;right:0;bottom:14px;text-align:center;display:grid;gap:4px;padding:0 16px}
.subs p{margin:0 auto;max-width:94%;padding:3px 10px;border-radius:4px;background:rgba(0,0,0,.74);color:#fff}
.subs p em{font-style:normal;font-size:10px;font-weight:700;opacity:.6;margin-right:6px;letter-spacing:.04em}
.subs .so{font-size:14px;font-style:italic;color:rgba(255,255,255,.9)}
.subs .st{font-size:16.5px;font-weight:600}
.subs p:empty{display:none}
.controls{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:center;padding:10px 12px;background:var(--mist);border-top:1px solid var(--rule)}
.controls .pp{width:38px;height:34px;border-radius:6px;border:1px solid var(--rule-2);background:var(--paper);display:grid;place-items:center}
.scrubwrap{position:relative;flex:1 1 180px;display:flex;align-items:center}
.scrubwrap input{width:100%;accent-color:var(--atlantic)}
.marks{position:absolute;left:8px;right:8px;top:-7px;height:0}
.mk{position:absolute;top:0;width:10px;height:10px;margin-left:-5px;border-radius:50%;border:2px solid var(--mist);background:var(--bridge);padding:0}
.time{font-size:13px;color:var(--slate);min-width:86px;font-variant-numeric:tabular-nums}
.controls select{border:1px solid var(--rule-2);border-radius:6px;padding:4px 8px;font-size:13.5px;background:var(--paper)}
.langbar{background:var(--paper)}
.langbar .lb{font-size:13px;color:var(--slate);font-weight:600}
.pnote{margin-top:10px;font-size:13.5px;color:var(--slate)}
.vfail{margin-top:10px;font-size:14px;color:#A2401B;font-weight:600}
.vfail:empty{display:none}
.lite-pack{display:none}
body.lite .player{display:none}
body.lite .player.real{display:block}
body.lite .lite-pack{display:block;margin-bottom:18px}
body.lite .pgrid{grid-template-columns:1fr}
.lite-pack p{font-size:14px;color:var(--slate);margin-bottom:12px}
.transcript{border:1px solid var(--rule);border-radius:8px;max-height:470px;overflow:auto}
.transcript .th{position:sticky;top:0;background:var(--paper);padding:12px 16px;border-bottom:1px solid var(--rule);z-index:1}
.transcript .th b{display:block;font-size:15px}
.transcript .th span{font-size:13px;color:var(--slate)}
.transcript ol{margin:0;padding:0;list-style:none}
.transcript li{display:grid;grid-template-columns:42px 1fr;gap:10px;padding:10px 16px;border-bottom:1px solid var(--rule);cursor:pointer;font-size:14.5px}
.transcript li:hover{background:var(--mist)}
.transcript li.on{background:#FFF4EE;box-shadow:inset 3px 0 0 var(--bridge)}
.transcript .tt{font-size:12.5px;color:var(--faint);padding-top:2px;font-variant-numeric:tabular-nums}
.transcript .l1{display:block;margin-top:2px;color:var(--slate);font-size:13.5px}

/* Comments + credits */
.cgrid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(260px,1fr);gap:24px;margin-top:36px;align-items:start}
.blockh{font-size:18px;font-weight:700;display:flex;align-items:baseline;gap:10px}
.blockh .c{font-size:14px;color:var(--faint);font-weight:600}
.clist{margin-top:12px;border-top:1px solid var(--rule)}
.cmt{padding:16px 0;border-bottom:1px solid var(--rule);transition:background .2s}
.cmt.now{background:#FFF7F2}
.cmt.new{background:#FFF1E8}
.cmeta{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:13.5px;color:var(--slate)}
.cmeta b{color:var(--ink);font-weight:650}
.tc{border:1px solid var(--rule-2);background:var(--paper);border-radius:4px;padding:0 8px;font-size:13px;font-weight:600;color:var(--atlantic);font-variant-numeric:tabular-nums}
.tc:hover{border-color:var(--atlantic)}
.ctype{font-size:12.5px;font-weight:650;color:var(--bridge)}
.ctext{margin-top:8px;font-size:15px;max-width:72ch}
.ctext .tr{font-size:12px;color:var(--faint);margin-right:6px}
.cform{margin-top:18px}
.cform summary{cursor:pointer;font-weight:650;color:var(--atlantic);width:max-content}
.cform form{display:grid;gap:12px;margin-top:14px;padding:18px;background:var(--mist);border-radius:8px}
.row2,.row3{display:grid;gap:12px}
.row2{grid-template-columns:1fr 1fr}
.row3{grid-template-columns:repeat(3,1fr)}
.credits{border-top:2px solid var(--ink);padding-top:14px}
.credits .mode{font-size:13.5px;color:var(--slate);margin-top:6px}
.credits dl{display:grid;grid-template-columns:92px 1fr;gap:8px 12px;margin:12px 0 0;font-size:14px}
.credits dt{color:var(--faint)}
.credits dd{margin:0}

/* Summary */
.sgrid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(280px,1fr);gap:40px;align-items:start}
.sdl{margin:28px 0 0;display:grid;grid-template-columns:150px 1fr;border-top:1px solid var(--rule)}
.sdl dt,.sdl dd{margin:0;padding:14px 0;border-bottom:1px solid var(--rule)}
.sdl dt{font-size:14px;font-weight:650;color:var(--slate);padding-right:16px}
.sdl dd{font-size:15.5px;max-width:68ch}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule-2);border-radius:4px;padding:1px 8px;font-size:13px;color:var(--slate);background:var(--paper)}
button.tag:hover{border-color:var(--atlantic);color:var(--atlantic)}
.tag i{font-style:normal;color:var(--faint)}
.gauge{display:flex;gap:6px;flex-wrap:wrap}
.gauge span{font-size:13px;color:var(--faint);padding:1px 8px;border-radius:4px;border:1px solid var(--rule)}
.gauge span.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.kbox{background:var(--mist);border-radius:8px;padding:22px 22px 18px}
.kbox h4{font-size:13.5px;color:var(--slate);font-weight:650}
.kbox h3{margin-top:4px;font-size:19px;font-weight:700}
.kbox .figs{margin-top:16px;display:grid;gap:12px}
.kbox .diff{margin-top:18px;padding-top:14px;border-top:1px solid var(--rule-2);font-size:14.5px}
.kbox .diff b{display:block;font-size:13.5px;color:var(--slate);margin-bottom:4px}
.kbox .cav{margin-top:12px;font-size:13px;color:var(--faint)}
.srcs{margin-top:22px;font-size:13.5px;color:var(--slate);display:grid;gap:4px}
.srcs b{color:var(--ink);font-weight:650;margin-right:6px}

/* Partnerships */
.pgrid2{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(280px,1fr);gap:40px;align-items:start}
.steps3{display:grid;grid-template-columns:repeat(3,1fr);margin:6px 0 30px;position:relative}
.steps3::before{content:"";position:absolute;left:9px;right:calc(33.3% - 9px);top:9px;height:2px;background:var(--rule-2)}
.steps3 .st{position:relative;display:grid;gap:8px;font-size:14px;color:var(--faint)}
.steps3 .st i{width:20px;height:20px;border-radius:50%;border:2px solid var(--rule-2);background:var(--paper);position:relative;z-index:1}
.steps3 .st.done i{background:var(--ink);border-color:var(--ink)}
.steps3 .st.now{color:var(--ink);font-weight:700}
.steps3 .st.now i{border-color:var(--bridge);background:var(--bridge)}
.steps3 .bar{position:absolute;left:9px;top:9px;height:2px;background:var(--ink)}
.plog{margin:12px 0 0;padding:0;list-style:none;border-left:2px solid var(--rule);display:grid;gap:14px}
.plog li{position:relative;padding-left:18px;font-size:15px}
.plog li::before{content:"";position:absolute;left:-6px;top:8px;width:10px;height:10px;border-radius:50%;background:var(--rule-2)}
.plog li.new::before{background:var(--bridge)}
.plog .d{font-size:13px;font-weight:650;color:var(--slate);margin-right:8px;font-variant-numeric:tabular-nums}
.partners{margin:8px 0 0;padding:0;list-style:none;display:grid;gap:8px}
.partners li{display:flex;gap:10px;align-items:baseline;font-size:15px}
.partners li span{font-size:12.5px;color:var(--faint)}
.criteria{margin-top:20px;font-size:13.5px;color:var(--slate)}
.side-box{border-top:2px solid var(--ink);padding-top:14px}
.side-box h4{font-size:15px;font-weight:700}
.side-box .linked{display:grid;gap:8px;margin-top:10px}
.side-box .linked button{border:0;border-bottom:1px solid var(--rule);background:none;padding:8px 0;text-align:left;display:flex;justify-content:space-between;gap:10px;font-size:14px}
.side-box .linked button:hover{color:var(--atlantic)}
.mt{margin-top:28px}

/* ---------- Modals ---------- */
.modal{width:min(640px,94vw);margin:auto}
.mbox{background:var(--paper);border-radius:10px;max-height:92vh;display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(21,33,46,.25)}
.mbox header{padding:18px 22px;border-bottom:1px solid var(--rule);display:flex;justify-content:space-between;gap:12px;align-items:center}
.mbox header h3{font-size:19px;font-weight:700}
.mbox form{padding:18px 22px 22px;overflow:auto;display:grid;gap:14px}
.mintro{font-size:14px;color:var(--slate)}
.fld{display:grid;gap:5px;font-size:13.5px;font-weight:600;color:var(--slate)}
.fld input,.fld select,.fld textarea{border:1px solid var(--rule-2);border-radius:6px;padding:9px 12px;font-size:15px;font-weight:400;color:var(--ink);background:var(--paper)}
.fld input[type=file]{padding:6px}
.fld textarea{min-height:88px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:2px solid var(--atlantic);outline-offset:0;border-color:var(--atlantic)}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--ink)}
.chk input{margin-top:4px;accent-color:var(--atlantic)}
.hint{font-size:13px;color:var(--faint);font-weight:400}
.err{color:#B3261E;font-size:13.5px;min-height:1em}
.formact{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}
.forpin{font-size:14px;color:var(--slate);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.forpin b{color:var(--ink)}

/* ---------- Footer / toast ---------- */
footer{background:var(--mist);border-top:1px solid var(--rule);color:var(--slate);font-size:13.5px}
footer .wrap{padding-top:28px;padding-bottom:36px;display:grid;gap:8px;max-width:1200px}
footer p{max-width:100ch}
#toasts{position:fixed;right:20px;bottom:20px;display:grid;gap:8px;z-index:100}
.toast{background:var(--ink);color:#fff;border-radius:8px;padding:11px 16px;font-size:14px;max-width:380px;box-shadow:0 10px 30px rgba(21,33,46,.25);animation:tin .2s ease}
@keyframes tin{from{transform:translateY(8px);opacity:0}}

/* ---------- Responsive ---------- */
@media (max-width:1020px){
  .map-layout,.pgrid,.cgrid,.sgrid,.pgrid2{grid-template-columns:1fr}
  .head-row{gap:16px}
}
@media (max-width:860px){
  .head-row{height:auto;flex-wrap:wrap;padding-top:10px;padding-bottom:0;row-gap:6px}
  .main-nav{order:3;flex-basis:100%;overflow-x:auto;margin:0 -8px}
  .head-tools{margin-left:auto}
  .lite-toggle span{display:none}
  .head-tools .btn{display:none}
}
@media (max-width:720px){
  .wrap{padding:0 18px}
  .hero{padding-top:40px}
  .flow{margin-top:40px}
  .flow-steps{grid-template-columns:1fr;gap:28px;padding-left:28px;position:relative}
  .flow-arch{display:none}
  .flow-steps::before{content:"";position:absolute;left:8px;top:4px;bottom:4px;width:2px;background:var(--bridge)}
  .flow-step{padding-top:0}
  .flow-step .pier{top:3px;left:-28px}
  .flow-step h3{margin-top:0}
  .qitem{grid-template-columns:1fr}
  .qside{flex-direction:row;flex-wrap:wrap}
  .vhead,.vscroll{padding-left:18px;padding-right:18px}
  .vhead h2{font-size:22px}
  .row2,.row3{grid-template-columns:1fr}
  .sdl{grid-template-columns:1fr}
  .sdl dt{border-bottom:0;padding-bottom:0}
  .field{min-width:0;flex:1 1 200px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="site-head">
  <div class="wrap head-row">
    <button type="button" class="brand" data-tab="videos" aria-label="Passerelle 180 Atlas">
      <svg width="34" height="24" viewBox="0 0 34 24" aria-hidden="true"><path d="M2 19C9 1 25 1 32 19" fill="none" stroke="#D9592A" stroke-width="2.2"/><path d="M1 19H33" stroke="#15212E" stroke-width="2"/><path d="M9.5 19V10.5M17 19V6.8M24.5 19V10.5" stroke="#9AA7B5" stroke-width="1.3"/></svg>
      <span class="brand-name">Passerelle 180 Atlas</span>
    </button>
    <nav class="main-nav" id="main-nav">
      <button type="button" data-tab="videos" data-t="nav.videos"></button>
      <button type="button" data-tab="map" data-t="nav.map"></button>

</header>

<main>
  <div class="panel on" id="panel-videos">

      <div class="wrap">
        <h1 data-t="hero.h1"></h1>
        <p class="lead" data-t="hero.lead"></p>
        <div class="hero-cta">
          <button type="button" class="btn btn-primary" data-act="register" data-t="register"></button>
          <button type="button" class="btn" data-act="browse" data-t="hero.browse"></button>

        <div class="flow">
          <svg class="flow-arch" viewBox="0 0 1200 92" preserveAspectRatio="none" aria-hidden="true"><path class="hanger" d="M50 73.1V90"/><path class="hanger" d="M100 59.4V90"/><path class="hanger" d="M150 47.9V90"/><path class="hanger" d="M200 38.2V90"/><path class="hanger" d="M250 30.1V90"/><path class="hanger" d="M300 23.4V90"/><path class="hanger" d="M350 17.9V90"/><path class="hanger" d="M400 13.5V90"/><path class="hanger" d="M450 10.2V90"/><path class="hanger" d="M500 7.9V90"/><path class="hanger" d="M550 6.5V90"/><path class="hanger" d="M600 6.0V90"/><path class="hanger" d="M650 6.5V90"/><path class="hanger" d="M700 7.9V90"/><path class="hanger" d="M750 10.2V90"/><path class="hanger" d="M800 13.5V90"/><path class="hanger" d="M850 17.9V90"/><path class="hanger" d="M900 23.4V90"/><path class="hanger" d="M950 30.1V90"/><path class="hanger" d="M1000 38.2V90"/><path class="hanger" d="M1050 47.9V90"/><path class="hanger" d="M1100 59.4V90"/><path class="hanger" d="M1150 73.1V90"/><path class="arch" d="M0 90C300 -22 900 -22 1200 90" vector-effect="non-scaling-stroke"/><path class="deck" d="M0 90H1200" vector-effect="non-scaling-stroke"/></svg>
          <ol class="flow-steps">
            <li class="flow-step"><span class="pier" aria-hidden="true"></span><h3><span class="n">1</span><span data-t="s1.t"></span></h3><p data-t="s1.p"></p><button type="button" class="linkbtn" data-act="register" data-t="s1.a"></button></li>
            <li class="flow-step"><span class="pier" aria-hidden="true"></span><h3><span class="n">2</span><span data-t="s2.t"></span></h3><p data-t="s2.p"></p><button type="button" class="linkbtn" data-act="example-comments" data-t="s2.a"></button></li>
            <li class="flow-step"><span class="pier" aria-hidden="true"></span><h3><span class="n">3</span><span data-t="s3.t"></span></h3><p data-t="s3.p"></p><button type="button" class="linkbtn" data-act="example-partner" data-t="s3.a"></button></li>
          </ol>
        </div>
        <p class="stats" id="stats" aria-live="polite"></p>
      </div>
    </section>
    <section class="section" id="videos-list">
      <div class="wrap">
        <div class="section-head"><h2 data-t="videos.h"></h2><p data-t="videos.p"></p></div>
        <div class="toolbar">
          <div class="chips" id="feed-track"></div>
          <input class="field" id="feed-q" type="search" data-tp="search.ph">
          <span class="spacer"></span>
          <select class="field" id="feed-sort" data-ta="sort.aria" style="min-width:0">
            <option value="new" data-t="sort.new"></option><option value="pop" data-t="sort.pop"></option><option value="bridge" data-t="sort.bridge"></option>
          </select>

  <div class="panel" id="panel-map">

              <div class="seg" id="views">

                <button type="button" data-view="kr" aria-pressed="false" data-t="view.kr"></button>

              <div class="chips" id="map-track"></div>
            </div>
            <div class="mapwrap">
              <svg id="map" viewBox="0 0 1000 520" role="group"><g id="g-base"></g><g id="g-arcs"></g><g id="g-pins"></g><g id="g-labels"></g></svg>
              <div class="legend" id="legend"></div>
            </div>
          </div>
          <aside class="map-side">
            <div class="map-detail" id="map-detail"></div>
            <div><h3 class="plist-h" data-t="map.list"></h3><div class="plist" id="map-list"></div></div>
          </aside>
        </div>
      </div>
    </section>
  </div>

  <div class="panel" id="panel-qna">

          <button type="button" class="btn btn-primary" data-act="ask" data-t="qna.ask"></button>

        <div class="toolbar"><div class="chips" id="q-track"></div><span class="spacer"></span><div class="seg" id="q-status" role="group"></div></div>
        <div class="qlist" id="qlist"></div>
      </div>

  <div class="panel" id="panel-gloss">
    <section class="section">
      <div class="wrap">
        <div class="section-head"><h2 data-t="gloss.h"></h2><p data-t="gloss.p"></p></div>
        <div class="toolbar">
          <input class="field" id="g-q" type="search" data-tp="gloss.ph" style="min-width:300px">
          <span class="spacer"></span><span class="hint" id="g-count"></span>

        <div class="ggrid" id="gloss"></div>
      </div>
    </section>
  </div>
</main>

<footer>
  <div class="wrap">
    <p data-t="foot.sample"></p>
    <p data-t="foot.org"></p>
    <p data-t="foot.keys"></p>
  </div>
</footer>

<dialog class="viewer" id="viewer"><div class="vbox" id="vbox"></div></dialog>

<dialog class="modal" id="m-add"><div class="mbox">
  <header><h3 data-t="m.add.t"></h3><button type="button" class="xbtn" data-close data-ta="close"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M1 1l10 10M11 1L1 11" stroke="currentColor" stroke-width="1.6"/></svg></button></header>
  <form id="f-add" novalidate>
    <p class="mintro" data-t="m.add.p"></p>
    <label class="fld"><span><span data-t="f.title"></span> *</span><input name="title" required data-tp="f.title.ph"></label>
    <div class="row2">
      <label class="fld"><span><span data-t="f.presenter"></span> *</span><input name="who" required data-tp="f.presenter.ph"></label>
      <label class="fld"><span data-t="f.talkLang"></span><select name="lang" id="add-lang"></select></label>
    </div>
    <div class="row2">
      <label class="fld"><span><span data-t="f.country"></span> *</span><select name="country" id="add-country"></select></label>
      <label class="fld"><span><span data-t="f.city"></span> *</span><input name="city" required placeholder="Ouagadougou"></label>
    </div>

    { id: "q-2027-004", author: "resident", code: "CI", city: "Abidjan (Yopougon)", track: "infra", sdg: "9.1", date: "2027-02-18T07:40:00Z", orig: "fr", linked: "abidjan", status: "pending",
      text: { fr: "À Yopougon, l'eau du robinet ne coule que la nuit, entre 1 h et 5 h. Nous remplissons des bidons. Est-ce que la nappe est en train de s'épuiser ?", ko: "요푸공에서는 수돗물이 밤 1시~5시에만 나옵니다. 물통에 받아 둡니다. 지하수층이 고갈되고 있는 건가요?", en: "In Yopougon, tap water only runs at night, between 1 and 5 a.m. We fill jerrycans. Is the aquifer running dry?" },
      note: { ko: "질문이 두 개입니다. 급수 시간이 제한되는 이유, 그리고 지하수층이 고갈되는지입니다. ‘1 h et 5 h’는 현지 시각(GMT)으로 한국 시각 10:00~14:00입니다. 아비장 지하수 연구자와 한국 지하수 관측 전문가에게 배정을 기다리고 있습니다.", fr: "Deux questions : pourquoi l'eau est rationnée, et si la nappe s'épuise. « 1 h et 5 h » = heure locale (GMT), soit 10 h–14 h à Séoul. En attente d'attribution à la chercheuse d'Abidjan et à un expert coréen des eaux souterraines.", en: "Two questions: why water is rationed, and whether the aquifer is running dry. '1 h to 5 h' is local time (GMT), 10:00–14:00 in Korea. Waiting to be assigned to the Abidjan researcher and a Korean groundwater expert." },
      answer: null },
    { id: "q-2027-003", author: "student", code: "CM", city: "Bafoussam", track: "innov", sdg: "9.c", date: "2027-02-14T16:05:00Z", orig: "fr", linked: "cameroun", status: "answered",
      text: { fr: "Je suis étudiante en licence et je rentre au village le week-end. Les cours en vidéo épuisent mon forfait de données en deux jours.", ko: "저는 학부생이고 주말에는 고향 마을에 갑니다. 동영상 강의 때문에 데이터 요금제가 이틀 만에 바닥납니다.", en: "I'm an undergraduate and go back to my village at weekends. Video lectures use up my data bundle in two days." },
      note: { ko: "‘forfait’는 ‘몰수’가 아니라 ‘데이터 요금제’입니다. 디지털 접근(SDG 9.c) 문제라 카메룬 오프라인 앱 연구팀에 배정했습니다.", fr: "« Forfait » = forfait de données. Accès numérique (ODD 9.c) : transmis à l'équipe de l'application hors ligne.", en: "'Forfait' here means a data bundle, not a forfeit. A digital-access issue (SDG 9.c), assigned to the Cameroon offline-app team." },
      answer: { verified: true, date: "2027-02-16", name: { ko: "오프라인 앱 연구팀 (가상)", fr: "Équipe de l'application hors ligne (fictif)", en: "Offline app team (fictional)" }, org: { ko: "카메룬 대학 컴퓨터공학 연구실", fr: "Laboratoire d'informatique, université camerounaise", en: "Computer science lab, Cameroonian university" },
        text: { ko: "캠퍼스 와이파이에서 강의를 미리 내려받고, 교수님께 영상 대신 음성과 슬라이드 파일을 요청해 보세요. 데이터 사용량이 크게 줄어듭니다. 저희 앱도 한 번 받은 강의를 연결 없이 다시 보고, 다시 연결되면 바뀐 부분만 받게 만들고 있습니다. 2주 사용성 시험에 학생 그룹을 넣겠습니다.", fr: "Téléchargez les cours sur le wifi du campus et demandez des fichiers audio et des diapositives plutôt que des vidéos : la consommation baisse fortement. Notre application garde aussi les cours hors ligne et ne télécharge que les changements. Nous inclurons un groupe d'étudiants dans notre test de deux semaines.", en: "Download lectures on campus Wi-Fi and ask lecturers for audio and slides instead of video; it cuts data use sharply. Our app also keeps downloaded lectures offline and fetches only changes. We'll include a student group in our two-week usability test." } } },
    { id: "q-2027-002", author: "resident", code: "BJ", city: "Savè (Collines)", track: "indus", sdg: "9.3", date: "2027-02-11T10:20:00Z", orig: "fr", linked: "benin", status: "answered",
      text: { fr: "Nous séchons les noix de cajou au sol. Avec l'humidité, une partie moisit dans le magasin avant la vente. Comment réduire ces pertes ?", ko: "캐슈를 바닥에 말립니다. 습기 때문에 팔기 전에 창고에서 일부가 곰팡이가 핍니다. 손실을 어떻게 줄일 수 있나요?", en: "We dry cashew nuts on the ground. With the humidity, some go mouldy in the store before sale. How can we reduce these losses?" },
      note: { ko: "‘magasin’은 ‘상점’이 아니라 ‘창고’입니다. 수확 뒤 건조·보관 손실 문제라 식품공정 전문가에게 배정하고 베냉 연구팀에도 공유했습니다.", fr: "« Magasin » = entrepôt. Pertes après récolte : transmis à un expert en procédés et à l'équipe du Bénin.", en: "'Magasin' here means a storehouse, not a shop. Post-harvest drying and storage losses: assigned to a food-processing expert and shared with the Benin team." },
      answer: { verified: true, date: "2027-02-13", name: { ko: "김○○ (가상)", fr: "Kim (fictif)", en: "Kim (fictional)" }, org: { ko: "식품공정 연구실", fr: "Laboratoire de génie des procédés alimentaires", en: "Food process engineering lab" },
        text: { ko: "바닥 대신 방수포나 건조대 위에서 2~3일 햇볕에 말려 수분을 약 10% 아래로 낮추는 것이 핵심입니다. 보관할 때는 통기성 있는 마대에 담아 팔레트 위에 올리고 벽에서 띄워 두세요. 협동조합 단위로 간이 수분계를 함께 쓰면 비용을 나눌 수 있습니다.", fr: "Séchez les noix sur bâche ou claie 2 à 3 jours pour descendre sous environ 10 % d'humidité, puis stockez-les en sacs de jute sur palettes, loin des murs. Un humidimètre partagé par la coopérative réduit les coûts.", en: "Dry the nuts on tarpaulins or racks for 2–3 days to bring moisture below about 10%, then store them in jute sacks on pallets away from walls. A moisture meter shared by the cooperative keeps costs down." } } },
    { id: "q-2027-001", author: "resident", code: "SN", city: "Dakar (banlieue)", track: "infra", sdg: "9.1", date: "2027-02-09T08:15:00Z", orig: "fr", linked: "dakar", status: "answered",
      text: { fr: "Pendant l'hivernage, le chemin vers la station BRT de mon quartier est inondé. Je dois faire un détour de 20 minutes ou marcher dans l'eau.", ko: "우기에는 우리 동네 BRT 정류장으로 가는 길이 물에 잠깁니다. 20분을 돌아가거나 물속을 걸어야 합니다.", en: "During the rainy season, the path to my neighbourhood's BRT station floods. I have to make a 20-minute detour or walk through the water." },
      note: { ko: "‘hivernage’는 ‘겨울’이 아니라 서아프리카의 우기(대략 7~10월)입니다. 버스 운행이 아니라 정류장 접근로가 잠기는 문제라 다카르 보행 접근성 연구팀과 한국 도시 배수 전문가에게 배정했습니다.", fr: "« Hivernage » = saison des pluies. Accès piéton inondé : transmis à l'équipe de Dakar et à un expert coréen du drainage urbain.", en: "'Hivernage' is the West African rainy season (roughly July–October), not winter. The problem is a flooded access path, not the bus service: assigned to the Dakar pedestrian-access team and a Korean urban drainage expert." },
      answer: { verified: true, date: "2027-02-11", name: { ko: "BRT 보행 접근성 연구팀 (가상)", fr: "Équipe accès piéton BRT (fictif)", en: "BRT pedestrian access team (fictional)" }, org: { ko: "ESP·UCAD 토목공학 연구실", fr: "Laboratoire de génie civil, ESP-UCAD", en: "Civil engineering lab, ESP-UCAD" },
        text: { ko: "잠기는 접근로를 지도에 표시해 CETUD에 전달하는 것이 첫걸음입니다. 우기 전에 정류장 주변 배수로를 청소하고 횡단 지점을 조금 높이는 저비용 조치가 효과적입니다. 한국 도시들도 장마 전에 빗물받이를 일제히 점검합니다. 제보하신 정류장을 진행 중인 23개 정류장 조사에 넣겠습니다.", fr: "Première étape : cartographier les accès inondés et les transmettre au CETUD. Curer les caniveaux avant l'hivernage et surélever les traversées sont des mesures peu coûteuses. Votre station sera ajoutée à notre enquête sur 23 stations.", en: "First step: map the flooded access paths and send them to CETUD. Cleaning roadside drains before the rainy season and raising crossings slightly are low-cost fixes; Korean cities also check storm drains before the monsoon. We'll add your station to our 23-station survey." } } }

    renderAll(); drawPins(); markMapSel(); renderMapSide();
    if (state.viewer && state.viewer.id === p.id) { state.viewer.tab = "partner"; var keepT = player.t; renderViewer(); player.t = keepT; updatePlayerUI(); $("#vscroll").scrollTop = 0; }
    toast(before === p.status ? T("m.br.same", { d: d }) : T("m.br.changed", { a: L(STATUS[before]), b: L(STATUS[p.status]) }));
  }

  function submitAsk(e) {
    e.preventDefault();
    var f = e.target, text = f.elements.text.value.trim(), city = f.elements.city.value.trim(), lang = f.elements.lang.value;
    if (!text || !city) { $("#ask-err").textContent = T("m.ask.err"); return; }
    var c = C_BY_CODE[f.elements.country.value], track = f.elements.track.value;
    var guess = PINS.filter(function (p) { return p.code === c.code; })[0] || PINS.filter(function (p) { return p.track === track; })[0];
    var note = {}; LANGS.forEach(function (lg) { note[lg] = UI[lg]["ask.note"].replace("{pin}", guess ? (guess.title[lg] || guess.title.en) : UI[lg]["ask.none"]); });
    var q = { id: "q-2027-" + String(QNA.length + 1).padStart(3, "0"), author: f.elements.author.value, code: c.code, city: city, track: track, sdg: { infra: "9.1", indus: "9.3", innov: "9.c" }[track], date: new Date().toISOString(), orig: lang,
      text: {}, note: note, linked: guess ? guess.id : null, status: "pending", answer: null, justAdded: true };
    q.text[lang] = text;
    QNA.unshift(q);
    closeModal($("#m-ask")); f.reset(); fillSelects();
    state.qStatus = "all"; state.qTrack = "all"; buildFilters();
    renderAll();
    toast(T("m.ask.toast", { id: q.id }));
  }
  var answerFor = null;
  function openAnswer(qid) {
    answerFor = qid; var q = QNA.filter(function (x) { return x.id === qid; })[0];
    $("#answer-for").innerHTML = "<b>" + esc(q.id) + "</b><span>" + esc(trText(q.text, q.orig).main) + "</span>";
    var sel = $("#answer-pin");
    sel.innerHTML = PINS.map(function (p) { return '<option value="' + p.id + '">' + esc(L(p.title)) + "</option>"; }).join("");
    $("#answer-err").textContent = ""; $("#f-answer").reset(); sel.value = q.linked || PINS[0].id;
    openModal("#m-answer");
  }
  function submitAnswer(e) {
    e.preventDefault();
    var f = e.target, name = f.elements.name.value.trim(), org = f.elements.org.value.trim(), text = f.elements.text.value.trim();
    if (!name || !org || !text) { $("#answer-err").textContent = T("m.an.err"); return; }
    var q = QNA.filter(function (x) { return x.id === answerFor; })[0];
    q.answer = { name: name, org: org, verified: f.elements.verified.checked, date: new Date().toISOString().slice(0, 10), text: {}, orig: state.ui };
    q.answer.text[state.ui] = text;
    q.status = "answered"; q.linked = f.elements.pin.value; q.justAdded = true;
    closeModal($("#m-answer"));
    renderAll();
    var el = document.getElementById(q.id); if (el) el.scrollIntoView({ block: "center", behavior: reduceMotion ? "auto" : "smooth" });
    toast(T("m.an.toast"));
  }

  /* =========================================================
     렌더 · 이벤트 · 시작
     ========================================================= */
  function renderAll() { renderStats(); renderFeed(); renderQnA(); renderMapSide(); }
  function setTab(t) {
    state.tab = t;
    $$("#main-nav [data-tab]").forEach(function (b) { if (b.getAttribute("data-tab") === t) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current"); });
    $$(".panel").forEach(function (p) { p.classList.toggle("on", p.id === "panel-" + t); });
    window.scrollTo(0, 0);
  }
  function act(name) {
    if (name === "register") { $("#add-err").textContent = ""; openModal("#m-add"); }
    else if (name === "browse") { var l = $("#videos-list"); if (l) l.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth" }); }
    else if (name === "example-comments") { openViewer("gharb", "video"); var cb = $("#cbox"); if (cb) setTimeout(function () { cb.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "start" }); }, 60); }
    else if (name === "example-partner") { openViewer("quebec", "partner"); }
    else if (name === "ask") { $("#ask-err").textContent = ""; openModal("#m-ask"); }
  }

  document.addEventListener("click", function (e) {
    var t = e.target.closest("[data-open],[data-bridge],[data-answer],[data-mapsel],[data-vtab],[data-term],[data-goq],[data-close],[data-jump],[data-gocmt],[data-act],[data-tab],[data-ui],[data-ft],[data-mt],[data-qt],[data-qs],[data-gd],[data-view],#v-close");
    if (!t) return;
    if (t.hasAttribute("data-jump")) { seekTo(+t.getAttribute("data-jump")); if (!player.playing && canPlay()) startPlay(); return; }
    if (t.hasAttribute("data-gocmt")) { var ce = $('[data-cid="' + t.getAttribute("data-gocmt") + '"]'); if (ce) ce.scrollIntoView({ block: "center", behavior: reduceMotion ? "auto" : "smooth" }); return; }
    if (t.id === "v-close") { closeViewer(); return; }
    if (t.hasAttribute("data-close")) { closeModal(t.closest("dialog")); return; }
    if (t.hasAttribute("data-open")) { openViewer(t.getAttribute("data-open")); return; }
    if (t.hasAttribute("data-bridge")) { openBridge(t.getAttribute("data-bridge")); return; }
    if (t.hasAttribute("data-answer")) { openAnswer(t.getAttribute("data-answer")); return; }
    if (t.hasAttribute("data-mapsel")) { selectMapPin(t.getAttribute("data-mapsel")); return; }
    if (t.hasAttribute("data-act")) { act(t.getAttribute("data-act")); return; }
    if (t.hasAttribute("data-ui")) { setUI(t.getAttribute("data-ui")); return; }
    if (t.hasAttribute("data-tab")) { setTab(t.getAttribute("data-tab")); return; }
    if (t.hasAttribute("data-view")) { setView(t.getAttribute("data-view")); return; }
    if (t.hasAttribute("data-ft")) { state.feedTrack = t.getAttribute("data-ft"); buildFilters(); renderFeed(); return; }
    if (t.hasAttribute("data-mt")) { state.mapTrack = t.getAttribute("data-mt"); buildFilters(); applyMapFilter(); return; }
    if (t.hasAttribute("data-qt")) { state.qTrack = t.getAttribute("data-qt"); buildFilters(); renderQnA(); return; }
    if (t.hasAttribute("data-qs")) { state.qStatus = t.getAttribute("data-qs"); buildFilters(); renderQnA(); return; }
    if (t.hasAttribute("data-gd")) { state.gDom = t.getAttribute("data-gd"); buildFilters(); renderGloss(); return; }
    if (t.hasAttribute("data-vtab")) {
      state.viewer.tab = t.getAttribute("data-vtab");
      $$("#vbox [data-vtab]").forEach(function (x) { x.setAttribute("aria-selected", String(x === t)); });
      $$("#vbox .vsec").forEach(function (s) { s.classList.toggle("on", s.getAttribute("data-sec") === state.viewer.tab); });
      if (state.viewer.tab !== "video") stopPlay();
      $("#vscroll").scrollTop = 0;
      return;
    }
    if (t.hasAttribute("data-term")) {
      var term = t.getAttribute("data-term"); closeViewer(); setTab("gloss");
      state.gQ = term.split(" / ")[0].split(" (")[0]; $("#g-q").value = state.gQ; state.gDom = "all"; buildFilters(); renderGloss(); return;
    }
    if (t.hasAttribute("data-goq")) {
      var qid = t.getAttribute("data-goq"); closeViewer(); setTab("qna"); state.qStatus = "all"; state.qTrack = "all"; buildFilters(); renderQnA();
      var el = document.getElementById(qid); if (el) { el.scrollIntoView({ block: "center" }); el.classList.add("new"); }
    }
  });

  var lite = $("#lite");
  try { if (localStorage.getItem("p180-lite") === "1") lite.checked = true; } catch (e) {}
  function applyLite() {
    state.lite = lite.checked;
    document.body.classList.toggle("lite", state.lite);
    if (state.lite) stopPlay();
    var gr = $("#grat");
    if (state.lite && gr) gr.remove();
    else if (!state.lite && !gr && MAPDATA) { var s = $("#g-base .sphere"); var n = svgEl("path", { d: MAPDATA.graticule, "class": "grat", id: "grat" }); s.parentNode.insertBefore(n, s.nextSibling); }
    renderFeed();
    if (state.viewer) { var keep = player.t; renderViewer(); player.t = keep; updatePlayerUI(); }
    try { localStorage.setItem("p180-lite", state.lite ? "1" : "0"); } catch (e) {}
  }
  lite.addEventListener("change", function () { applyLite(); toast(T(state.lite ? "lite.on" : "lite.off")); });
  $("#feed-q").addEventListener("input", function (e) { state.feedQ = e.target.value; renderFeed(); });
  $("#feed-sort").addEventListener("change", function (e) { state.sort = e.target.value; renderFeed(); });
  $("#g-q").addEventListener("input", function (e) { state.gQ = e.target.value; renderGloss(); });
  $("#f-add").addEventListener("submit", submitAdd);
  $("#f-bridge").addEventListener("submit", submitBridge);
  $("#f-ask").addEventListener("submit", submitAsk);
  $("#f-answer").addEventListener("submit", submitAnswer);
  $("#viewer").addEventListener("close", function () { stopPlay(); state.viewer = null; });
  $("#viewer").addEventListener("click", function (e) { if (e.target === e.currentTarget) closeViewer(); });
  document.addEventListener("keydown", function (e) {
    var tag = (e.target.tagName || "").toLowerCase();
    if (tag === "input" || tag === "textarea" || tag === "select") return;
    if (!state.viewer || $("#m-bridge").open) return;
    if (e.key === " " || e.code === "Space") { e.preventDefault(); if (state.viewer.tab === "video") togglePlay(); }
    if (e.key === "ArrowRight") seekTo(player.t + 5);
    if (e.key === "ArrowLeft") seekTo(player.t - 5);
  });

  // 시작
  var saved = null; try { saved = localStorage.getItem("p180-ui"); } catch (e) {}
  if (saved && LANGS.indexOf(saved) >= 0) state.ui = saved;
  state.lite = lite.checked; document.body.classList.toggle("lite", state.lite);
  renderStatic();
  setTab("videos");
  buildMap();
  renderAll(); renderGloss();
  // 주소 끝 #핀id(예: …/#gharb) → 그 영상의 상세 화면을 바로 엶
  function openFromHash() {
    var id = ""; try { id = decodeURIComponent((location.hash || "").slice(1)); } catch (e) {}
    if (id && byId[id] && byId[id].kind === "research" && !(state.viewer && state.viewer.id === id)) openViewer(id);
  }
  openFromHash();
  window.addEventListener("hashchange", openFromHash);

})();
</script>
</body>
</html>
